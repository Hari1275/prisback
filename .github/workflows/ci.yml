name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - name: Install
        run: pnpm install --no-frozen-lockfile
        env:
          CI: true
      - name: Build core packages
        run: |
          pnpm --filter @prisback/context... run build
          pnpm --filter @prisback/core run build
          pnpm --filter @prisback/prisma run build
          pnpm --filter @prisback/authentication run build
          pnpm --filter @prisback/cache run build
          pnpm --filter @prisback/rest run build
      - name: Unit tests (core surface)
        run: |
          pnpm --filter @prisback/core exec pb-mocha "dist/__tests__/unit/module.unit.js"
          pnpm --filter @prisback/prisma run unit
          pnpm --filter @prisback/authentication run unit
          pnpm --filter @prisback/cache run unit
          pnpm --filter @prisback/cli exec pb-mocha --lang en_US.UTF-8 "test/prisback/**/*.js"

  e2e-smoke:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
        env:
          CI: true
      - name: Build packages needed by smoke
        run: |
          pnpm --filter @prisback/core run build
          pnpm --filter @prisback/prisma run build
          pnpm --filter @prisback/authentication run build
          pnpm --filter @prisback/rest run build
        env:
          CI: true
      - name: E2E CLI smoke (sqlite)
        run: node packages/cli/scripts/e2e-smoke.js
        env:
          CI: true
